name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: bun install --frozen-lockfile
      - name: Versions match tag
        run: bun run scripts/check-versions.ts
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Build library and CLI
        run: bun run build
      - name: Build Linux binaries
        run: bun run build:bin

      - name: Checksums
        run: |
          cd dist
          sha256sum wsl-shadow-linux-x64 wsl-shadow-linux-arm64 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish to npm (skip if version already exists)
        # First 0.1.0 publish is done by hand. Re-running the tag must still attach binaries.
        # No NPM_TOKEN: OIDC trusted publishing for kanchingyg/wsl-shadow (see PUBLICAR.md).
        # registry-has-version: 0 = exists (skip), 1 = missing (publish), 2 = hard error (publish anyway).
        run: |
          set -euo pipefail
          VER=$(node -p "require('./package.json').version")
          set +e
          bun run scripts/registry-has-version.ts npm wsl-shadow "$VER"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "npm already has wsl-shadow@${VER}; skipping publish"
          else
            npm publish --access public --provenance
          fi

      - name: Publish to JSR (skip if version already exists)
        run: |
          set -euo pipefail
          VER=$(node -p "require('./jsr.json').version")
          set +e
          bun run scripts/registry-has-version.ts jsr @kanchingyg/wsl-shadow "$VER"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "JSR already has @kanchingyg/wsl-shadow@${VER}; skipping publish"
          else
            bunx jsr publish --allow-dirty
          fi

      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/wsl-shadow-linux-x64
            dist/wsl-shadow-linux-arm64
            dist/SHA256SUMS.txt
          generate_release_notes: true
