name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for trusted publishing
        # Trusted publishing (OIDC, no NPM_TOKEN) needs npm >= 11.5.1. Node 22 ships older npm.
        run: |
          set -euo pipefail
          npm install -g npm@latest
          npm -v

      - name: Require npm >= 11.5.1 for trusted publishing
        run: |
          set -euo pipefail
          VER=$(npm -v)
          echo "npm $VER"
          node -e '
            const v = process.argv[1].split(".").map(Number);
            const ok = v[0] > 11 || (v[0] === 11 && (v[1] > 5 || (v[1] === 5 && v[2] >= 1)));
            if (!ok) {
              console.error(`npm ${process.argv[1]} cannot do trusted publishing (needs >= 11.5.1). Refusing to publish.`);
              process.exit(1);
            }
          ' "$VER"

      - name: Install
        run: bun install --frozen-lockfile
      - name: Versions match tag
        run: bun run scripts/check-versions.ts
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Build library and CLI
        run: bun run build
      - name: Build Linux binaries
        run: bun run build:bin

      - name: Checksums
        run: |
          cd dist
          sha256sum wsl-shadow-linux-x64 wsl-shadow-linux-arm64 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish to npm (skip if version already exists)
        # No NPM_TOKEN: OIDC trusted publishing for kanchingyg/wsl-shadow (see PUBLICAR.md).
        # registry-has-version: 0 = exists (skip), 1 = missing (publish), 2 = hard error (publish anyway).
        run: |
          set -euo pipefail
          VER=$(node -p "require('./package.json').version")
          set +e
          bun run scripts/registry-has-version.ts npm wsl-shadow "$VER"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "npm already has wsl-shadow@${VER}; skipping publish"
          else
            npm publish --access public --provenance
          fi

      - name: Publish to JSR (skip if version already exists)
        run: |
          set -euo pipefail
          VER=$(node -p "require('./jsr.json').version")
          set +e
          bun run scripts/registry-has-version.ts jsr @kanchingyg/wsl-shadow "$VER"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "JSR already has @kanchingyg/wsl-shadow@${VER}; skipping publish"
          else
            bunx jsr publish --allow-dirty
          fi

      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/wsl-shadow-linux-x64
            dist/wsl-shadow-linux-arm64
            dist/SHA256SUMS.txt
          generate_release_notes: true
